[workspace]
name = "component-build"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[dependencies]
python = ">=3.14,<3.15"
pip = ">=26,<27"

[pypi-dependencies]
hatchling = ">=1.28,<2"
pytest = ">=8.4,<9"
f8pysdk = {path = "../.sdk/python", editable = true}

[tasks]
publish = "python ../publish.py"
