name: publish-component

on:
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: SDK source commit containing component publication contracts
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: feel8-fun/f8sdk
          ref: ${{ inputs.sdk_ref }}
          path: .sdk
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.81.0
          manifest-path: .ci/pixi.toml
          cache: true
      - run: pixi run --locked --manifest-path .ci/pixi.toml publish
      - uses: actions/upload-artifact@v4
        with:
          name: component-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
