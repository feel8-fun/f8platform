[project]
name = "f8platform"
version = "0.1.0"
description = "Headless launcher and extension runtime management for Feel8."
requires-python = ">=3.14,<3.15"
dependencies = ["f8pysdk[platform-api]", "msgspec>=0.18.6,<1", "pyyaml>=6,<7", "packaging>=25,<27", "fastapi>=0.120,<1", "uvicorn>=0.35,<1", "httpx>=0.28,<1"]

[project.scripts]
f8platform = "f8platform.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["f8platform"]

[tool.uv]
package = true
